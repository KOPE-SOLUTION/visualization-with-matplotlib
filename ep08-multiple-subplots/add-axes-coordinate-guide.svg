<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">การกำหนดตำแหน่ง Axes ด้วย fig.add_axes</title>
  <desc id="desc">แผนภาพอธิบาย left bottom width และ height ในระบบพิกัด Figure ซึ่งเริ่มจากมุมซ้ายล่างและมีค่าตั้งแต่ศูนย์ถึงหนึ่ง</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="axesFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset="1" stop-color="#d5eaff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#19324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f8b8d"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .grid { stroke: #b9c8d8; stroke-width: 1; stroke-dasharray: 4 7; opacity: 0.72; }
      .tick { fill: #60758b; font-size: 16px; }
      .measure { fill: none; stroke-width: 3; marker-start: url(#arrowBlue); marker-end: url(#arrowBlue); }
      .chip { rx: 7; ry: 7; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <rect x="22" y="22" width="1236" height="676" rx="28" fill="#ffffff" stroke="#dce6f1" stroke-width="2" filter="url(#shadow)"/>

  <text x="65" y="74" class="font" font-size="30" font-weight="700" fill="#102a43">เข้าใจ fig.add_axes([left, bottom, width, height])</text>
  <text x="66" y="107" class="font" font-size="18" fill="#52667a">ตัวเลขทั้งสี่เป็น “สัดส่วนของ Figure” ตั้งแต่ 0 ถึง 1 — ไม่ใช่หน่วยพิกเซล</text>
  <image x="1040" y="41" width="177" height="71" preserveAspectRatio="xMidYMid meet" xlink:href="kope-solution-logo-2027.png" href="kope-solution-logo-2027.png"/>

  <!-- Figure coordinate canvas -->
  <rect x="92" y="151" width="824" height="504" rx="18" fill="#f9fbfd" stroke="#9fb2c5" stroke-width="2"/>
  <text x="151" y="181" class="font" font-size="18" font-weight="700" fill="#34495e">Figure</text>

  <!-- Normalized grid: x=130..890, y=190..620 -->
  <g>
    <line x1="130" y1="190" x2="130" y2="620" class="grid"/>
    <line x1="282" y1="190" x2="282" y2="620" class="grid"/>
    <line x1="434" y1="190" x2="434" y2="620" class="grid"/>
    <line x1="586" y1="190" x2="586" y2="620" class="grid"/>
    <line x1="738" y1="190" x2="738" y2="620" class="grid"/>
    <line x1="890" y1="190" x2="890" y2="620" class="grid"/>
    <line x1="130" y1="620" x2="890" y2="620" class="grid"/>
    <line x1="130" y1="534" x2="890" y2="534" class="grid"/>
    <line x1="130" y1="448" x2="890" y2="448" class="grid"/>
    <line x1="130" y1="362" x2="890" y2="362" class="grid"/>
    <line x1="130" y1="276" x2="890" y2="276" class="grid"/>
    <line x1="130" y1="190" x2="890" y2="190" class="grid"/>
  </g>

  <!-- Coordinate axes -->
  <line x1="130" y1="620" x2="900" y2="620" stroke="#34495e" stroke-width="2.5"/>
  <path d="M 900 620 l -10 -6 l 0 12 z" fill="#34495e"/>
  <line x1="130" y1="620" x2="130" y2="180" stroke="#34495e" stroke-width="2.5"/>
  <path d="M 130 180 l -6 10 l 12 0 z" fill="#34495e"/>
  <text x="106" y="646" class="font tick">(0, 0)</text>
  <text x="855" y="181" class="font tick">(1, 1)</text>
  <text x="905" y="627" class="font tick">x</text>
  <text x="122" y="174" class="font tick">y</text>

  <!-- Axes rectangle for [0.20, 0.18, 0.58, 0.58] -->
  <rect x="282" y="293" width="441" height="249" rx="8" fill="url(#axesFill)" stroke="#1769aa" stroke-width="3"/>
  <text x="502" y="399" text-anchor="middle" class="font" font-size="30" font-weight="700" fill="#1769aa">Axes</text>
  <text x="502" y="429" text-anchor="middle" class="mono" font-size="17" fill="#476b87">ตำแหน่งและขนาดที่เรากำหนด</text>
  <path d="M 323 487 C 370 463, 402 477, 447 441 S 532 469, 574 410 S 650 397, 684 353" fill="none" stroke="#1769aa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="323" cy="487" r="5" fill="#1769aa"/>
  <circle cx="447" cy="441" r="5" fill="#1769aa"/>
  <circle cx="574" cy="410" r="5" fill="#1769aa"/>
  <circle cx="684" cy="353" r="5" fill="#1769aa"/>

  <!-- left measurement -->
  <line x1="130" y1="222" x2="282" y2="222" stroke="#2563eb" stroke-width="3" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <line x1="130" y1="229" x2="130" y2="293" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>
  <line x1="282" y1="229" x2="282" y2="293" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>
  <rect x="151" y="206" width="110" height="31" rx="8" fill="#dbeafe"/>
  <text x="206" y="228" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#1d4ed8">left = 0.20</text>

  <!-- bottom measurement -->
  <line x1="842" y1="620" x2="842" y2="542" stroke="#dc2626" stroke-width="3" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <line x1="723" y1="542" x2="835" y2="542" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>
  <rect x="693" y="565" width="132" height="31" rx="8" fill="#fee2e2"/>
  <text x="759" y="587" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#b91c1c">bottom = 0.18</text>

  <!-- width measurement -->
  <line x1="282" y1="264" x2="723" y2="264" stroke="#0f8b8d" stroke-width="3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <line x1="282" y1="271" x2="282" y2="293" stroke="#0f8b8d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>
  <line x1="723" y1="271" x2="723" y2="293" stroke="#0f8b8d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>
  <rect x="440" y="248" width="125" height="31" rx="8" fill="#d5f5f1"/>
  <text x="502" y="270" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#087577">width = 0.58</text>

  <!-- height measurement -->
  <line x1="758" y1="293" x2="758" y2="542" stroke="#7c3aed" stroke-width="3" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>
  <line x1="723" y1="293" x2="751" y2="293" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>
  <line x1="723" y1="542" x2="751" y2="542" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>
  <g transform="translate(758 418) rotate(-90)">
    <rect x="-66" y="-16" width="132" height="31" rx="8" fill="#ede9fe"/>
    <text x="0" y="6" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#6d28d9">height = 0.58</text>
  </g>

  <!-- Right explanation panel -->
  <rect x="948" y="151" width="284" height="504" rx="18" fill="#102a43"/>
  <text x="977" y="191" class="font" font-size="19" font-weight="700" fill="#ffffff">ตัวอย่างในภาพ</text>
  <rect x="973" y="210" width="234" height="116" rx="12" fill="#0b2137" stroke="#2c4a66"/>
  <text x="991" y="240" class="mono" font-size="18" fill="#dcecff">fig.add_axes([</text>
  <text x="1010" y="270" class="mono" font-size="18"><tspan fill="#74a7ff">0.20</tspan><tspan fill="#dcecff">, </tspan><tspan fill="#ff8b8b">0.18</tspan><tspan fill="#dcecff">,</tspan></text>
  <text x="1010" y="299" class="mono" font-size="18"><tspan fill="#5ee0d5">0.58</tspan><tspan fill="#dcecff">, </tspan><tspan fill="#c4a7ff">0.58</tspan></text>
  <text x="991" y="319" class="mono" font-size="18" fill="#dcecff">])</text>

  <text x="977" y="367" class="font" font-size="18" font-weight="700" fill="#ffffff">ถ้า Figure = 1000 × 600 px</text>
  <g class="font" font-size="16">
    <circle cx="985" cy="397" r="6" fill="#74a7ff"/><text x="1002" y="403" fill="#dcecff">left  = 0.20 × 1000 = 200 px</text>
    <circle cx="985" cy="432" r="6" fill="#ff8b8b"/><text x="1002" y="438" fill="#dcecff">bottom = 0.18 × 600 = 108 px</text>
    <circle cx="985" cy="467" r="6" fill="#5ee0d5"/><text x="1002" y="473" fill="#dcecff">width = 0.58 × 1000 = 580 px</text>
    <circle cx="985" cy="502" r="6" fill="#c4a7ff"/><text x="1002" y="508" fill="#dcecff">height = 0.58 × 600 = 348 px</text>
  </g>

  <rect x="973" y="543" width="234" height="84" rx="12" fill="#173955" stroke="#315873"/>
  <text x="1090" y="572" text-anchor="middle" class="font" font-size="17" font-weight="700" fill="#ffffff">จำสั้น ๆ</text>
  <text x="1090" y="596" text-anchor="middle" class="font" font-size="15" fill="#dcecff">left, bottom = จุดเริ่ม</text>
  <text x="1090" y="617" text-anchor="middle" class="font" font-size="15" fill="#dcecff">width, height = ขนาด</text>

  <text x="504" y="684" text-anchor="middle" class="font" font-size="17" font-weight="600" fill="#52667a">Matplotlib วัดตำแหน่งจากมุมซ้ายล่างของ Figure</text>
</svg>
